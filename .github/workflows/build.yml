name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 注意：这里刻意不使用 android-actions/setup-android@v3。
      # 该 action 内部会执行 `sdkmanager tools`，而独立的 "tools" 包已从 SDK 仓库移除，
      # 会直接报 "Failed to find package 'tools'" 并让整个步骤失败。
      # GitHub 的 ubuntu runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 用自带的 sdkmanager 补齐所需组件即可，缺什么补什么。
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT = $SDK_ROOT"

          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager = $SDKMANAGER"

          # 接受许可（不阻断：镜像里通常已经接受过）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 逐个安装，失败只告警不阻断 —— 组件可能已预装，AGP 也能自动补下
          for pkg in "platform-tools" "platforms;android-36" "build-tools;36.0.0"; do
            echo "--- install $pkg ---"
            "$SDKMANAGER" --install "$pkg" || echo "警告：$pkg 未安装成功，继续构建"
          done

          echo "--- 现有 platforms ---"
          ls "$SDK_ROOT/platforms" || true
          echo "--- 现有 build-tools ---"
          ls "$SDK_ROOT/build-tools" || true

          # 让 AGP 明确知道 SDK 位置
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$SDK_ROOT" > local.properties
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug and release APK
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace \
            || (chmod +x ./gradlew && ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace)

      - name: Show APK info
        if: always()
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
