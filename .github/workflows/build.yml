name: Build APK

# 手动触发时（Actions 页面 → Run workflow）会弹出下面四个输入框，
# 留空则用 default 里的值。push / PR 触发时不弹框，一律用默认值。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      app_id:
        description: '包名 Package Name（反向域名格式，如 com.bugjump.ahuweb）'
        required: false
        default: 'com.bugjump.ahuweb'
        type: string
      app_name:
        description: '应用名称 App Name（显示在桌面/设置里）'
        required: false
        default: 'Ahu Plus'
        type: string
      version_code:
        description: '版本号 Version Code（整数，每次更新必须递增）'
        required: false
        default: '5'
        type: string
      version_name:
        description: '版本名 Version Name（展示用字符串，如 1.1.0）'
        required: false
        default: '1.3.1'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # inputs.* 在 push / PR 触发时为空字符串，用 || 回落到默认值
      APP_ID: ${{ inputs.app_id || 'com.bugjump.ahuweb' }}
      APP_NAME: ${{ inputs.app_name || 'Ahu Plus' }}
      VERSION_CODE: ${{ inputs.version_code || '5' }}
      VERSION_NAME: ${{ inputs.version_name || '1.3.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build parameters
        run: |
          echo "包名     appId       = $APP_ID"
          echo "应用名称 appName     = $APP_NAME"
          echo "版本号   versionCode = $VERSION_CODE"
          echo "版本名   versionName = $VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 注意：这里刻意不使用 android-actions/setup-android@v3。
      # 该 action 内部会执行 `sdkmanager tools`，而独立的 "tools" 包已从 SDK 仓库移除，
      # 会直接报 "Failed to find package 'tools'" 并让整个步骤失败。
      # GitHub 的 ubuntu runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 用自带的 sdkmanager 补齐所需组件即可，缺什么补什么。
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT = $SDK_ROOT"

          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager = $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # compileSdk 用 37（Miuix / Backdrop 的 AAR 元数据要求 >= 37）。
          # 逐个安装，失败只告警不阻断 —— 组件可能已预装，AGP 也能自动补下。
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0"; do
            echo "--- install $pkg ---"
            "$SDKMANAGER" --install "$pkg" || echo "警告：$pkg 未安装成功，继续构建"
          done

          echo "--- 现有 platforms ---"
          ls "$SDK_ROOT/platforms" || true
          echo "--- 现有 build-tools ---"
          ls "$SDK_ROOT/build-tools" || true

          if [ ! -f local.properties ]; then
            echo "sdk.dir=$SDK_ROOT" > local.properties
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 四个参数通过 -P 传给 Gradle，由 app/build.gradle.kts 读取
      - name: Build debug and release APK
        run: |
          ARGS=(
            "-PappId=$APP_ID"
            "-PappName=$APP_NAME"
            "-PversionCode=$VERSION_CODE"
            "-PversionName=$VERSION_NAME"
          )
          gradle :app:assembleDebug :app:assembleRelease "${ARGS[@]}" --stacktrace \
            || (chmod +x ./gradlew && ./gradlew :app:assembleDebug :app:assembleRelease "${ARGS[@]}" --stacktrace)

      # 把产物重命名成「应用名-版本名-变体.apk」，方便区分不同构建
      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          SAFE_NAME="$(echo "$APP_NAME" | tr -d ' /\\:*?\"<>|')"
          [ -n "$SAFE_NAME" ] || SAFE_NAME="app"
          for f in app/build/outputs/apk/*/*.apk; do
            [ -e "$f" ] || continue
            variant="$(basename "$(dirname "$f")")"
            cp "$f" "out/${SAFE_NAME}-${VERSION_NAME}-${variant}.apk"
          done
          echo "--- 产物 ---"
          ls -lh out

      # 产物名带上 run 编号：否则每次构建都叫 apk-1.0.0，
      # 从 Actions 列表里很容易下到上一次的旧包（这次"装了最新还是老样子"就是这么来的）
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.VERSION_NAME }}-r${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
